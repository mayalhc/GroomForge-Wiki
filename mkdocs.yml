site_name: chamiseul
site_description: User guides for the chamiseul Blender and Unreal Engine add-ons
site_author: chamiseul
site_url: https://mayalhc.github.io/GroomForge-Wiki/

theme:
  name: material
  language: en
  icon:
    logo: material/cube-outline
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Dark mode

extra_css:
  - custom.css

extra:
  social:
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@ChamIseul
      name: YouTube
    - icon: fontawesome/solid/cart-shopping
      link: https://superhivemarket.com/creators/chamiseul
      name: Superhive Market

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/media.py

plugins:
  - search

nav:
  - Add-ons: index.md
  - GroomForge PRO:
      - English: guide.md
      - 한국어: KO_index.md
  - Other guides: guides.md
